<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#000000"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><title>Pageturn – PDF Reader</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="style.css"></head><body>
<!-- Page structure only. Styling lives in style.css, behaviour in app.js (loaded last so every element below already exists). -->
<!-- Top toolbar: library, page number, zoom, highlight colours, eraser, bookmark colours/button, marks panel -->
<div id="bar" class="hide">
 <button id="home">☰<span class="lbl"> Library</span></button>
 <input id="pg" type="text" inputmode="numeric"><span id="tot"></span>
 <button id="zo">−</button><button id="zi">+</button>
 <span class="sp"></span>
 <span id="sws"></span>
 <button id="er" title="Tap highlights to remove them">Eraser</button>
 <span id="bcs"></span><button id="bmk">☆ Bookmark</button>
 <button id="pan">Marks</button>
 <input type="file" id="f" accept="application/pdf" class="hide">
</div>
<!-- Library screen: upload drop-zone + list of saved books (shown until a book is opened) -->
<div id="lib">
 <div id="drop"><h1>Pageturn</h1><p>Drop a PDF here, or tap to choose one.<br>Your place, bookmarks and highlights are remembered on this device.</p></div>
 <div id="books"></div>
</div>
<!-- Reader screen: page view with prev/next arrows, and the Marks side panel -->
<div id="main" class="hide"><div id="vw"><button id="pl" class="nav" aria-label="Previous page">‹</button><button id="nr" class="nav" aria-label="Next page">›</button><div id="view"><!-- One PDF page = three stacked layers: canvas (the picture), #hl (highlights), .textLayer (invisible selectable text) -->
<div id="wrap"><canvas id="cv"></canvas><div id="rib"></div><div id="hl"></div><div class="textLayer" id="tl"></div></div></div></div>
 <aside id="side"><h3>Bookmarks</h3><div id="bml"></div><h3>Highlights by page</h3><div id="hll"></div></aside></div>
<div id="msg"></div>
<script src="pdf.min.js"></script>
<script src="app.js"></script></body></html>
